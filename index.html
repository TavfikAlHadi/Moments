<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moments | Photo Digitisation and Restoration in Malaysia</title>
    <meta
      name="description"
      content="Preserve your family's photos forever. Professional digitisation, restoration, and secure cloud storage in Kuala Lumpur. Get your free quote today."
    />
    <meta property="og:title" content="Moments | Photo Digitisation and Restoration" />
    <meta
      property="og:description"
      content="Preserve your family's photos forever. Professional digitisation and restoration in Kuala Lumpur."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Static form so Netlify's build-time bot can detect and register it for Forms + email notifications. Submitted via fetch from LeadForm.tsx, never rendered. -->
    <form name="quote-request" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script>
      // Set theme before React mounts to avoid a light/dark flash on load.
      (function () {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
